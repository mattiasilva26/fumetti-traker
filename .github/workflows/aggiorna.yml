name: Aggiorna dati fumetti

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore (orario UTC)
  workflow_dispatch:         # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write            # serve per committare data.json

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r scraper/requirements.txt

      - name: Genera data.json
        run: python scraper/build.py

      - name: Committa se ci sono novità
        run: |
          git config user.name "fumetti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
