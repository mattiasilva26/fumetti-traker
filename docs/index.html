<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111116">
<meta name="description" content="Le uscite e la collezione di Dylan Dog e Toni Bellasalma.">
<title>Fumetti — la tua collezione</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:dark;--bg:#111116;--panel:#1b1b23;--panel2:#23232d;--text:#f5f2ed;--muted:#aaa7b2;--line:#35343e;--red:#ef514c;--gold:#f4c767;--green:#a9d4b5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{color:inherit}.wrap{max-width:1080px;margin:auto;padding:0 22px 90px}
header{padding:30px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--red);font-size:23px;box-shadow:0 8px 24px #ef514c33}h1{font-size:22px;margin:0;letter-spacing:-.04em}.tagline{color:var(--muted);font-size:13px;margin:5px 0 0}
nav{display:flex;gap:8px;margin-top:24px;overflow:auto}.navbtn{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:transparent;padding:10px 16px;color:var(--muted);cursor:pointer}.navbtn[aria-pressed=true]{color:white;background:var(--red);border-color:var(--red)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0}.status{font-size:12px;color:var(--muted)}.refresh,.filter,.search{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 13px;color:var(--text)}.refresh{cursor:pointer}.refresh:hover,.navbtn:hover{border-color:var(--red)}
.intro{padding:27px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(ellipse at 88% 0%,#ef514c24,transparent 47%),var(--panel);margin:25px 0}.eyebrow{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-weight:700}.intro h2{font-size:clamp(25px,5vw,38px);letter-spacing:-.045em;margin:9px 0}.intro p{margin:0;color:var(--muted);max-width:560px;line-height:1.55}.stats{display:flex;gap:24px;margin-top:20px}.stat strong{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.search{min-width:200px;flex:1}.search::placeholder{color:#898692}.filter{cursor:pointer;color:var(--muted)}.filter.active{background:var(--panel2);border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}.card{min-width:0;position:relative;border:1px solid var(--line);background:var(--panel);border-radius:13px;overflow:hidden;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-3px);border-color:#696571}.cover{aspect-ratio:2/2.55;background:linear-gradient(140deg,#302f39,#19191f);display:grid;place-items:center;color:#777;font-size:26px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cardbody{padding:8px}.series{color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:.06em}.title{font-size:12px;font-weight:700;line-height:1.3;margin:4px 0}.meta{font-size:10px;color:var(--muted)}.check{position:absolute;top:6px;right:6px;width:29px;height:29px;border:1px solid #ffffff77;background:#14141ddd;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:14px}.check[aria-pressed=true]{background:var(--green);color:#122218;border-color:var(--green)}.owned{opacity:.72}.owned .cover:after{content:"IN COLLEZIONE";position:absolute;left:5px;top:7px;padding:3px 5px;border-radius:5px;background:#15241ddd;color:var(--green);font-size:8px;font-weight:800;letter-spacing:.04em}
.sectiontitle{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:31px 0 12px}.sectiontitle h2{font-size:18px;margin:0;letter-spacing:-.03em}.sectiontitle span{font-size:12px;color:var(--muted)}.empty{padding:40px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);line-height:1.6}.empty b{display:block;color:var(--text);margin-bottom:5px}.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.news a{color:inherit;text-decoration:none}.news .card{padding:16px}.news .title{font-size:15px}.news .meta{margin-top:8px}.hidden{display:none!important}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:560px){.wrap{padding:0 13px 80px}header{padding-top:20px}.intro{padding:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cover{aspect-ratio:2/2.45}.toolbar{margin:15px 0}.status{max-width:70%}.filters{gap:6px}.filter{padding:8px 10px;font-size:12px}}
.preview{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);width:min(92vw,680px);max-height:90dvh;padding:0;overflow:auto}.preview::backdrop{background:#08080bd9;backdrop-filter:blur(5px)}.preview-inner{display:grid;grid-template-columns:minmax(130px,230px) 1fr;gap:22px;padding:22px}.preview-cover{width:100%;border-radius:11px;aspect-ratio:2/2.85;object-fit:cover;background:var(--panel2)}.preview h2{font-size:22px;line-height:1.2;margin:10px 0}.preview p{color:var(--muted);line-height:1.55}.preview-close{float:right;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;background:var(--panel2);cursor:pointer}.publisher-link{display:inline-block;padding:11px 15px;background:var(--red);color:white;text-decoration:none;border-radius:10px;font-weight:700}.preview-title{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.1em}@media(max-width:480px){.preview-inner{grid-template-columns:110px 1fr;gap:13px;padding:15px}.preview h2{font-size:18px}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><div class="mark" aria-hidden="true">📚</div><div><h1>Fumetti</h1><p class="tagline">Uscite, notizie e scaffale personale</p></div></div>
<nav aria-label="Sezioni"><button class="navbtn" aria-pressed="true" data-view="uscite">In edicola</button><button class="navbtn" aria-pressed="false" data-view="collezione">La mia collezione</button><button class="navbtn" aria-pressed="false" data-view="notizie">Notizie</button></nav></header>
<div class="toolbar"><span class="status" id="status" role="status" aria-live="polite">Carico il catalogo…</span><button class="refresh" id="refresh">↻ Aggiorna</button></div>
<main id="uscite"><div class="sectiontitle"><h2>In edicola</h2></div><section><div class="sectiontitle"><h2>Bonelli</h2></div><div id="releasesBonelli" class="grid"></div></section><section><div class="sectiontitle"><h2>Bugs Comics</h2></div><div id="releasesBugs" class="grid"></div></section></main>
<main id="collezione" class="hidden"><section class="intro"><div class="eyebrow">La mia collezione</div><h2>Uno scaffale alla volta.</h2><div class="stats"><div class="stat"><strong id="collectionOwned">0</strong><span>in collezione</span></div><div class="stat"><strong id="collectionMissing">0</strong><span>da trovare</span></div></div></section><div class="filters"><input class="search" id="search" type="search" placeholder="Cerca titolo o numero…" aria-label="Cerca nella collezione"><select class="filter" id="publisher" aria-label="Filtra per editore"><option value="Tutti">Tutti gli editori</option><option value="Bonelli">Bonelli</option><option value="Bugs Comics">Bugs Comics</option></select><select class="filter" id="collana" aria-label="Filtra per collana"><option value="Tutte">Tutte le collane</option></select><button class="filter active" data-filter="tutti" aria-pressed="true">Tutti</button><button class="filter" data-filter="mancanti" aria-pressed="false">Mi mancano</button><button class="filter" data-filter="posseduti" aria-pressed="false">Li possiedo</button></div><div id="collection"></div></main>
<main id="notizie" class="hidden"><div class="sectiontitle"><h2>Notizie dal mondo fumetto</h2></div><div id="news" class="news"></div></main>
<dialog class="preview" id="preview" aria-labelledby="previewHeading"><div class="preview-inner" id="previewContent"></div></dialog>
<footer class="tagline" style="text-align:center;padding-top:28px">Copertine e link rimandano alle fonti originali.</footer></div>
<script>
const state={data:{elementi:[]},view:"uscite",filter:"tutti",publisher:"Tutti",collana:"Tutte",series:new Set(["Dylan Dog","Toni Bellasalma"]),owned:new Set(JSON.parse(localStorage.getItem("fumetti-owned-v1")||"[]"))};
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function date(value){if(!value)return"";const d=new Date(value);return Number.isNaN(+d)?"":d.toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"})}
function series(item){return /dylan\s*dog/i.test(item.serie||item.titolo||"")?"Dylan Dog":/bellasalma/i.test(item.serie||item.titolo||"")?"Toni Bellasalma":""}
function itemId(item){return String(item.id||item.link||`${item.serie||item.editore}-${item.titolo}-${item.data}`)}
function cover(url){if(!url)return"<div class=cover aria-hidden=true>📖</div>";try{const parsed=new URL(url);if(parsed.protocol!=="https:")throw 0;return `<div class=cover><img src="${esc(parsed.href)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`}catch{return"<div class=cover aria-hidden=true>📖</div>"}}
function itemCard(item,index,collectible=false){const id=itemId(item);const checked=state.owned.has(id);const stamp=date(item.data);return `<article class="card ${checked?"owned":""}" ${collectible?"":"role=button tabindex=0 data-preview="+index+" aria-label=\"Apri anteprima: "+esc(item.titolo)+"\""}>${cover(item.cover)}${collectible?`<button class=check type=button data-id="${esc(id)}" aria-label="${checked?"Rimuovi dalla collezione":"Segna come posseduto"}: ${esc(item.titolo)}" aria-pressed="${checked}">${checked?"✓":"＋"}</button>`:""}<div class=cardbody><div class=series>${esc(item.collana||series(item)||item.editore||"Fumetto")}</div><div class=title>${esc(item.titolo||"Senza titolo")}</div><div class=meta>${esc(item.numero?`N. ${item.numero}`:stamp)}</div></div></article>`}
function render(){const all=state.data.collezione||state.data.elementi.filter(x=>x.tipo==="uscita"&&series(x));const catalog=all.filter(x=>state.series.has(series(x)));document.querySelector("#collectionOwned").textContent=catalog.filter(x=>state.owned.has(itemId(x))).length;document.querySelector("#collectionMissing").textContent=Math.max(0,catalog.length-catalog.filter(x=>state.owned.has(itemId(x))).length);
const releases=state.data.elementi.filter(x=>x.tipo==="uscita");const bonelli=releases.filter(x=>x.editore==="Bonelli");const bugs=releases.filter(x=>x.editore==="Bugs Comics");document.querySelector("#releasesBonelli").innerHTML=bonelli.map(x=>itemCard(x,releases.indexOf(x))).join("")||'<div class="empty">Nessuna uscita Bonelli.</div>';document.querySelector("#releasesBugs").innerHTML=bugs.map(x=>itemCard(x,releases.indexOf(x))).join("")||'<div class="empty">Nessuna uscita Bugs Comics.</div>';
const publishers=document.querySelector("#publisher");publishers.value=state.publisher;const filteredCatalog=catalog.filter(x=>state.publisher==="Tutti"||x.editore===state.publisher);const collane=[...new Set(filteredCatalog.map(x=>x.collana).filter(Boolean))].sort();const select=document.querySelector("#collana");const selected=select.value||"Tutte";select.innerHTML='<option value="Tutte">Tutte le collane</option>'+collane.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");select.value=collane.includes(selected)?selected:"Tutte";state.collana=select.value;
const search=document.querySelector("#search").value.trim().toLocaleLowerCase("it");let shown=filteredCatalog.filter(x=>(state.collana==="Tutte"||x.collana===state.collana)&&`${x.titolo} ${x.serie} ${x.numero||""} ${x.collana||""}`.toLocaleLowerCase("it").includes(search));if(state.filter==="mancanti")shown=shown.filter(x=>!state.owned.has(itemId(x)));if(state.filter==="posseduti")shown=shown.filter(x=>state.owned.has(itemId(x)));const collator=new Intl.Collator("it",{numeric:true,sensitivity:"base"});const publisherOrder=["Bonelli","Bugs Comics"];const collanaOrder=["Serie regolare","Color Fest","Oldboy","Speciale","Maxi","Gigante","Almanacco / Enciclopedia","Raccolte e ristampe","Cofanetti","Toni Bellasalma","Altre edizioni"];const ordered=(a,b)=>{const ai=Number(a.numero)||0,bi=Number(b.numero)||0;return (ai&&bi?ai-bi:collator.compare(a.titolo||"",b.titolo||""))||collator.compare(a.titolo||"",b.titolo||"")||String(a.data||"").localeCompare(String(b.data||""))};const groups=[...new Set(shown.map(x=>x.editore||"Altro"))].sort((a,b)=>publisherOrder.indexOf(a)-publisherOrder.indexOf(b));document.querySelector("#collection").innerHTML=groups.map(publisher=>{const publisherItems=shown.filter(x=>(x.editore||"Altro")===publisher);const categories=[...new Set(publisherItems.map(x=>x.collana||"Altre edizioni"))].sort((a,b)=>{const ai=collanaOrder.indexOf(a),bi=collanaOrder.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||collator.compare(a,b)});return `<section><div class="sectiontitle"><h2>${esc(publisher)}</h2></div>${categories.map(category=>`<section><div class="sectiontitle"><h2>${esc(category)}</h2><span>${publisherItems.filter(x=>(x.collana||"Altre edizioni")===category).length} albi</span></div><div class="grid">${publisherItems.filter(x=>(x.collana||"Altre edizioni")===category).sort(ordered).map(x=>itemCard(x,0,true)).join("")}</div></section>`).join("")}</section>`}).join("")||'<div class="empty"><b>Nessun albo trovato</b>Prova a modificare la ricerca o i filtri.</div>';
document.querySelector("#news").innerHTML=state.data.elementi.filter(x=>x.tipo==="news").map(x=>`<a href="${safeLink(x.link)}" target="_blank" rel="noopener noreferrer"><article class=card>${cover(x.cover)}<div class=title>${esc(x.titolo)}</div><div class=meta>${esc(x.fonte||"")} · ${date(x.data)}</div></article></a>`).join("")||'<div class="empty">Nessuna notizia disponibile.</div>'}
function safeLink(value){try{const u=new URL(value);return u.protocol==="https:"?esc(u.href):"#"}catch{return"#"}}
async function load(){document.querySelector("#status").textContent="Aggiorno il catalogo…";try{const response=await fetch(`data.json?v=${Date.now()}`,{cache:"no-store"});if(!response.ok)throw Error();state.data=await response.json();document.querySelector("#status").textContent=`Aggiornato ${date(state.data.aggiornato)} · ${state.data.conteggio||0} elementi`}catch{document.querySelector("#status").textContent="Catalogo non raggiungibile · controllo la copia salvata"}render()}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;state.view=b.dataset.view;document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));["uscite","collezione","notizie"].forEach(v=>document.getElementById(v).classList.toggle("hidden",v!==state.view))});
function showPreview(index){const item=state.data.elementi.filter(x=>x.tipo==="uscita")[index];if(!item)return;const image=item.cover&&safeLink(item.cover)!=="#"?`<img class="preview-cover" src="${safeLink(item.cover)}" alt="Copertina di ${esc(item.titolo)}">`:'<div class="preview-cover" aria-hidden="true">📖</div>';document.querySelector("#previewContent").innerHTML=`${image}<div><button class="preview-close" type="button" aria-label="Chiudi anteprima">×</button><div class="preview-title">${esc(item.collana||series(item)||item.editore||"Uscita")}</div><h2 id="previewHeading">${esc(item.titolo||"Senza titolo")}</h2><p>${esc(item.editore||item.fonte||"")}${item.data?` · ${date(item.data)}`:""}</p><a class="publisher-link" href="${safeLink(item.link)}" target="_blank" rel="noopener noreferrer">Apri la pagina dell’editore ↗</a></div>`;document.querySelector("#preview").showModal()}
document.addEventListener("click",e=>{const check=e.target.closest(".check");if(check){const id=check.dataset.id;state.owned.has(id)?state.owned.delete(id):state.owned.add(id);localStorage.setItem("fumetti-owned-v1",JSON.stringify([...state.owned]));render();return}const release=e.target.closest("[data-preview]");if(release){showPreview(Number(release.dataset.preview));return}if(e.target.closest(".preview-close")){document.querySelector("#preview").close();return}const f=e.target.closest("[data-filter]");if(f){state.filter=f.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>{x.classList.toggle("active",x===f);x.setAttribute("aria-pressed",String(x===f))});render();return}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-preview]")){e.preventDefault();showPreview(Number(e.target.dataset.preview))}if(e.key==="Escape")document.querySelector("#preview").close()});document.querySelector("#preview").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});document.querySelector("#publisher").addEventListener("change",e=>{state.publisher=e.target.value;state.collana="Tutte";render()});document.querySelector("#collana").addEventListener("change",e=>{state.collana=e.target.value;render()});document.querySelector("#search").addEventListener("input",render);document.querySelector("#refresh").addEventListener("click",load);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").then(reg=>reg.update()).catch(()=>{});load();
</script></body></html>
